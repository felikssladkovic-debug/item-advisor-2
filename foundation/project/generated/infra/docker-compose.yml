services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ../backend
    env_file:
      - ../../../.env
    depends_on:
      - mongodb
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mongo_data:
